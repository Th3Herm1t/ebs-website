        - heading: EXCELLENCE
          text: Une formation d’excellence alignée sur les standards internationaux.
        - heading: OUVERTURE
          text: Un réseau académique international pour élargir vos horizons.
        - heading: EMPLOYABILITÉ
          text: Des partenariats solides avec les entreprises pour construire votre
            carrière.
    occurrences:
      - programme_id: master-crm-transformation-digitale
        section_id: closing_values
        source_pages:
          - 4
      - programme_id: master-ingenierie-financiere
        section_id: closing_values
