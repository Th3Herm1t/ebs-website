      - programme_id: licence-marketing
        section_id: duration
        source_pages:
          - 1
  professional_experience:
    content:
      heading: STAGE PROFESSIONNEL
      text: Un stage en entreprise d’une durée de 2 à 3 mois au cours du cursus pour
        développer vos compétences et acquérir une expérience concrète.
    occurrences:
      - programme_id: licence-management
        section_id: professional_experience
        source_pages:
          - 2
      - programme_id: licence-marketing
        section_id: professional_experience
        source_pages:
          - 2
  pedagogy:
    content:
      heading: UNE PÉDAGOGIE TOURNÉE VERS L’ACTION
      items:
        - Cours interactifs et participatifs
        - Travaux de groupe et intelligence collective
        - Études de cas réelles et analyse de situations
        - Projets concrets en lien avec les entreprises
        - Évaluations continues et constructives
        - Accompagnement personnalisé tout au long du parcours
    occurrences:
      - programme_id: licence-management
        section_id: pedagogy
        source_pages:
          - 3
      - programme_id: licence-marketing
        section_id: pedagogy
        source_pages:
          - 3
  ai_learning:
    content:
      heading: L’IA AU SERVICE DE VOTRE APPRENTISSAGE
      items:
        - Outils intelligents pour apprendre et progresser
        - Analyse de données pour mieux comprendre et décider
        - Cas pratiques augmentés par l’IA
        - Développement de compétences numériques indispensables
      callout: L’IA n’est pas un remplacement, c’est un accélérateur de votre
        potentiel et de votre réussite.
    occurrences:
      - programme_id: licence-management
        section_id: ai_learning
        source_pages:
          - 3
      - programme_id: licence-marketing
        section_id: ai_learning
        source_pages:
          - 3
  international_pathways:
    content:
      heading: 3 PARCOURS POUR POURSUIVRE VOS ÉTUDES À L’INTERNATIONAL
      items:
        - heading: 1 année à EBS → Bachelor 2 en Italie | Link University – Rome
          text: Après validation de la première année de Licence à EBS, possibilité de
            poursuivre en 2ᵉ année de Bachelor à Link University, selon le
            programme choisi et les conditions d’admission.
        - heading: 2 années à EBS → Bachelor 3 à l’international | Établissements
            partenaires en Italie ou en France
          text: Après deux années de Licence validées à EBS, possibilité d’intégrer la 3ᵉ
            année de Bachelors proposés par des établissements partenaires en
            Italie ou en France, selon la filière et les conditions d’admission.
        - heading: Licence à EBS → Master à l’international | France • Canada • Italie
          text: Après l’obtention de la Licence EBS, possibilité de poursuivre en Master,
            Master Grande École, MSc ou autre cursus Bac+5 dans l’un de nos pays
            partenaires (France, Canada, Italie), selon l’établissement, la
            spécialité et les conditions d’admission.
    occurrences:
      - programme_id: licence-management
        section_id: international_pathways
        source_pages:
          - 4
      - programme_id: licence-marketing
        section_id: international_pathways
        source_pages:
          - 4
