  transversal_skills:
    content:
      heading: COMPÉTENCES TRANSVERSALES DÉVELOPPÉES
      items:
        - heading: Esprit critique et capacité de décision
          text: Évaluer les situations, anticiper les risques et choisir la meilleure
            option.
        - heading: Communication efficace
          text: S’exprimer clairement à l’oral et à l’écrit et convaincre avec impact.
        - heading: Gestion du temps et des priorités
          text: Planifier, prioriser et optimiser son organisation pour gagner en
            efficacité.
        - heading: "Compétences linguistiques : Anglais & Français"
          text: Renforcer vos compétences linguistiques avec une préparation aux
            certifications TOEFL & TCF.
    occurrences:
      - programme_id: licence-finance
        section_id: transversal_skills
        source_pages:
