    content:
      heading: L’EXCELLENCE ACADÉMIQUE AU SERVICE DE VOTRE AVENIR
      text: Un parcours structuré et progressif qui vous permet d’acquérir les
        compétences essentielles pour construire votre avenir et réaliser vos
        ambitions.
    occurrences:
      - programme_id: licence-finance
        section_id: closing
