      items:
        - heading: DIPLÔME
          text: Une formation académique reconnue et alignée sur les exigences du monde
            professionnel.
        - heading: EXPÉRIENCE
          text: Des projets concrets, des mises en situation et des activités qui
            développent vos compétences et votre confiance.
        - heading: CARRIÈRE
          text: Un accompagnement personnalisé pour vous aider à atteindre vos objectifs
            et réussir votre insertion professionnelle.
    occurrences:
