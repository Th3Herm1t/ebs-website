        participer activement à des projets concrets et développer durablement
        votre réseau professionnel.
      items:
        - Expérience professionnelle obligatoire en entreprise
        - Accompagnement personnalisé pour votre recherche d’emploi
        - Renforcement de votre employabilité professionnelle
    occurrences:
