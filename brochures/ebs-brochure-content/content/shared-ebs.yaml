  academic_partners_variant_2:
    content:
      heading: NOS PARTENAIRES ACADÉMIQUES INTERNATIONAUX
      text: Des universités et écoles de renom en France, en Italie et au Canada vous
        ouvrent les portes d’une poursuite d’études d’excellence.
      groups:
        - country: FRANCE
          partners:
            - EM NORMANDIE BUSINESS SCHOOL
            - excelia BUSINESS SCHOOL
            - SUP’DE COM
            - Paris School of Business
            - IDRAC BUSINESS SCHOOL
        - country: ITALIE
          partners:
            - UNIVERSITÀ DEGLI STUDI LINK
        - country: CANADA
          partners:
            - UQAT — UNIVERSITÉ DU QUÉBEC EN ABITIBI-TÉMISCAMINGUE
      conditions_source: Poursuite d’études possible après le Master 1 ou après
        l’obtention du diplôme selon les accords conclus avec nos partenaires.
    occurrences:
      - programme_id: master-crm-transformation-digitale
        section_id: academic_partners
        source_pages:
          - 4
      - programme_id: master-marketing-digital-ia
        section_id: academic_partners
        source_pages:
          - 4
  enterprise_partners:
    content:
      heading: NOS PARTENAIRES ENTREPRISES
      text: Des entreprises leaders qui collaborent avec EBS pour votre employabilité
        et votre réussite professionnelle.
      items:
        - satem
        - YPERYON — DIGITAL AGENCY
        - ARFORGHE — Association des Responsables de Formation et de Gestion
          Humaine dans les Entreprises
        - ASTEELFLASH — YOUR EMS PARTNER
        - Cayon Cloud Communications
        - MEDIANET
      extraction_note: Identités lisibles des logos ; orthographe de Cayon à confirmer
        sur l’asset original.
    occurrences:
