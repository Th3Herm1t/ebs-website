    heading: PRÉPAREZ-VOUS À DEVENIR UN EXPERT DE LA FINANCE, DE L’ANALYSE
      FINANCIÈRE ET DE L’INGÉNIERIE DES MARCHÉS.
    text: Ce Master d’excellence d’ESPIMA Business School forme des spécialistes
      capables d’accompagner les entreprises et les institutions financières
      dans leurs décisions stratégiques. Il associe finance d’entreprise,
      marchés financiers, gestion des risques, Business Intelligence,
      Intelligence Artificielle et technologies financières afin de répondre aux
      nouvelles exigences du secteur financier.
    source_text_status: visually_transcribed
    review_required: false
