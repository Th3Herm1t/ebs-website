  reasons_intro:
    source_pages:
      - 3
    heading: 6 RAISONS DE CHOISIR L’EXCELLENCE POUR CONSTRUIRE VOTRE AVENIR
    text: Un Master conçu pour développer des compétences recherchées, vous rendre
      opérationnel dès demain et vous ouvrir les portes d’une carrière solide et
      internationale dans la finance.
    programme_title_source: MASTER EN INGÉNIERIE FINANCIÈRE
    source_text_status: visually_transcribed
    review_required: false
  reasons_to_choose:
    source_pages:
      - 3
    items:
      - heading: IA INTÉGRÉE DANS TOUS LES CURSUS
        text: L’intelligence artificielle est intégrée dans tous les modules pour vous
          donner une longueur d’avance et vous préparer aux métiers de demain.
      - heading: 20+ CERTIFICATIONS INTERNATIONALES
        text: Obtenez des certifications reconnues par les entreprises et valorisées par
          les recruteurs pour renforcer vos compétences et votre employabilité.
      - heading: PROJETS RÉELS & ÉTUDES DE CAS
        text: Apprenez en agissant sur des projets concrets d’entreprises et des études
          de cas réels pour développer votre sens de l’analyse et votre impact.
      - heading: OUTILS & LOGICIELS PROFESSIONNELS
        text: Maîtrisez les outils financiers et logiciels les plus utilisés par les
          professionnels (Bloomberg, Excel avancé, Power BI, EViews...).
      - heading: OUVERTURE INTERNATIONALE
        text: Partenariats prestigieux et possibilités de poursuite d’études en France,
          en Italie et au Canada pour construire une carrière sans frontières.
      - heading: ACCOMPAGNEMENT VERS LA RÉUSSITE
        text: "Un accompagnement personnalisé vers l’emploi : coaching, ateliers, job
          dating et suivi de votre insertion professionnelle."
