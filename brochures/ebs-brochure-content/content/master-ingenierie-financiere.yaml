    heading: UN PROGRAMME COMPLET ET OPÉRATIONNEL SUR 2 ANNÉES
    text: Un parcours progressif en 4 semestres qui combine finance d’entreprise,
      ingénierie financière, marchés financiers, gestion des risques, Business
      Intelligence et Intelligence Artificielle pour développer des compétences
      recherchées par les entreprises et les institutions financières.
    programme_title_source: MASTER EN INGÉNIERIE FINANCIÈRE
    source_text_status: visually_transcribed
    review_required: false
  curriculum_blocks:
    source_pages:
      - 2
    heading: LE PROGRAMME EN 5 GRANDS BLOCS DE COMPÉTENCES
    groups:
      - heading: FINANCE D’ENTREPRISE & INGÉNIERIE FINANCIÈRE
        items:
          - Finance d’entreprise
          - Diagnostic financier
          - Décision d’investissement
          - Évaluation d’entreprise
          - Restructuration financière
          - Ingénierie financière
      - heading: ANALYSE FINANCIÈRE & DÉCISION
        items:
          - Analyse financière
          - Modélisation financière
          - Tableaux de bord
          - Contrôle de gestion
          - Performance financière
          - Décision stratégique
      - heading: MARCHÉS FINANCIERS & GESTION DES RISQUES
        items:
          - Marchés financiers
          - Gestion de portefeuille
          - Produits financiers
          - Gestion des risques
          - Finance internationale
          - Réglementation financière
      - heading: BUSINESS INTELLIGENCE & INTELLIGENCE ARTIFICIELLE
        items:
          - Business Intelligence
          - Data Analytics
          - IA appliquée à la finance
          - Analyse prédictive
          - Tableaux de bord avancés
          - FinTech
      - heading: PROFESSIONNALISATION & EXPERTISE
