    heading: VOTRE AVENIR, NOTRE ENGAGEMENT.
    text: À EBS, nous formons les experts financiers capables de relever les défis
      d’aujourd’hui et de demain. Grâce à notre réseau académique international
      et à nos partenaires entreprises, nous vous offrons des opportunités
      concrètes et un avenir sans frontières.
    programme_title_source: MASTER EN INGÉNIERIE FINANCIÈRE
    source_text_status: visually_transcribed
    review_required: false
