    heading: MASTER MANAGEMENT DE PROJETS INNOVANTS & STARTUPS
    text: Devenez un leader de projets innovants et startups à l’ère de l’IA. Ce
      Master vous prépare à concevoir, piloter et réussir des projets innovants
      et des startups performantes grâce à l’innovation, l’agilité et la
      transformation digitale.
    source_text_status: visually_transcribed
    review_required: false
  curriculum_semesters:
    source_pages:
      - 2
    heading: UN PROGRAMME COMPLET ET OPÉRATIONNEL SUR 2 ANNÉES
    groups:
      - semester: 1
        heading: FONDAMENTAUX DU MANAGEMENT ET DE L’INNOVATION
        items:
          - Management de projet
          - Fondamentaux du management
          - Marketing de l’innovation
          - Comprendre les données avec l’IA
          - Outils collaboratifs & digitaux
          - Analyse professionnelle
      - semester: 2
        heading: MÉTHODES ET OUTILS AGILES & STARTUP
        items:
          - Gestion financière de projet
          - Méthodes agiles & Lean Startup
          - Design Thinking
          - Business Intelligence
          - Intelligence artificielle appliquée
          - Soft skills
      - semester: 3
        heading: RISQUES, STRATÉGIE ET FINANCEMENT
        items:
          - Gestion des risques
          - Modélisation économique
          - Droit des affaires
          - Startup Management
          - Financement de l’innovation
      - semester: 4
        heading: LEADERSHIP, CROISSANCE ET INCUBATION
        items:
          - Stratégie & croissance
          - Management d’équipe & leadership
          - Éthique & responsabilité
          - Projet de fin d’études (PFE)
          - Accompagnement startup / Incubation
